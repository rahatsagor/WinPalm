name: Release packages
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: winpalm-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version and build complete package
        shell: pwsh
        run: |
          bun scripts/release-notes.ts check $env:RELEASE_TAG
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/build.ps1 -Architecture '${{ matrix.architecture }}' -DevelopmentDirectory "$env:RUNNER_TEMP/winpalm-dev" -Package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/winpalm-dev/artifacts/WinPalm-*-win-*.zip
            ${{ runner.temp }}/winpalm-dev/artifacts/WinPalm-*-win-*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.architecture == 'x64'
        with:
          name: release-source
          path: ${{ runner.temp }}/winpalm-dev/artifacts/WinPalm-*-source.zip
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: packages
      - name: Install setup compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      - name: Build universal setup EXE
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/payloads/x64" "$RUNNER_TEMP/payloads/arm64"
          unzip -q "packages/WinPalm-$VERSION-win-x64.zip" -d "$RUNNER_TEMP/payloads/x64"
          unzip -q "packages/WinPalm-$VERSION-win-arm64.zip" -d "$RUNNER_TEMP/payloads/arm64"
          bun scripts/build-installer.ts --payloads "$RUNNER_TEMP/payloads" --output "$GITHUB_WORKSPACE/packages/WinPalm-$VERSION-Setup.exe"
          (cd packages && sha256sum *.zip *.exe > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Verify downloads and prepare draft release
        shell: bash
        run: |
          bun scripts/release-notes.ts check "$RELEASE_TAG"
          bun scripts/release-notes.ts notes "$RELEASE_TAG" > "$RUNNER_TEMP/notes.md"
          VERSION="${RELEASE_TAG#v}"
          (cd packages && sha256sum -c "WinPalm-$VERSION-win-x64.zip.sha256" "WinPalm-$VERSION-win-arm64.zip.sha256")
          if DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$DRAFT" != true ]]; then
              echo '::error::This release is already published. Use a new version.'
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "WinPalm $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$RELEASE_TAG" --clobber packages/*
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "WinPalm $VERSION" --notes-file "$RUNNER_TEMP/notes.md" packages/*
          fi
          echo 'Review the setup EXE on Windows, verify the deployed website/video links, then publish the draft as the latest stable release.' >> "$GITHUB_STEP_SUMMARY"
