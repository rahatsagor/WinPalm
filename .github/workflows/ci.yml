name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate and package
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - architecture: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Build, test and verify native package
        shell: pwsh
        run: ./scripts/build.ps1 -Architecture '${{ matrix.architecture }}' -DevelopmentDirectory "$env:RUNNER_TEMP/winpalm-dev" -Package
      - name: Check signature verification with disposable test certificates
        shell: pwsh
        timeout-minutes: 5
        run: |
          $Version = (Get-Content web/package.json -Raw | ConvertFrom-Json).version
          ./scripts/test-signatures.ps1 -PackageDirectory "$env:RUNNER_TEMP/winpalm-dev/artifacts/builds/${{ matrix.architecture }}" -Version $Version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winpalm-package-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/winpalm-dev/artifacts/WinPalm-*-win-*.zip
            ${{ runner.temp }}/winpalm-dev/artifacts/WinPalm-*-win-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.architecture == 'x64'
        with:
          name: winpalm-source
          path: ${{ runner.temp }}/winpalm-dev/artifacts/WinPalm-*-source.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: winpalm-diagnostics-${{ matrix.architecture }}
          path: ${{ runner.temp }}/winpalm-dev/artifacts/self-test-*.json
          if-no-files-found: ignore
          retention-days: 7
