name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-and-core:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Rust checks
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP/cargo-target"
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and verify x64 package
        shell: pwsh
        run: ./scripts/build.ps1 -Architecture x64 -DevelopmentDirectory "$env:RUNNER_TEMP/winpalm-dev" -Package -SkipChecks
      - name: Update regression checks
        shell: pwsh
        run: |
          bun scripts/release-notes.ts check ((Get-Content web/package.json -Raw | ConvertFrom-Json).version)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project windows/WinPalm.UpdateTests -c Release --artifacts-path "$env:RUNNER_TEMP/update-tests"
      - name: Phone regression checks
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP/winpalm-dev/cache/phone-workspace"
          bun run lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WinPalm-windows-x64
          path: |
            ${{ runner.temp }}/winpalm-dev/artifacts/*.zip
            ${{ runner.temp }}/winpalm-dev/artifacts/*.sha256
            ${{ runner.temp }}/winpalm-dev/artifacts/self-test-*.json
  arm64:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify ARM64 package
        shell: pwsh
        run: ./scripts/build.ps1 -Architecture arm64 -DevelopmentDirectory "$env:RUNNER_TEMP/winpalm-dev" -Package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WinPalm-windows-arm64
          path: |
            ${{ runner.temp }}/winpalm-dev/artifacts/*.zip
            ${{ runner.temp }}/winpalm-dev/artifacts/*.sha256
            ${{ runner.temp }}/winpalm-dev/artifacts/self-test-*.json
